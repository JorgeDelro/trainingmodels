url: https://jorgedelro.github.io/trainingmodels/
template:
  bootstrap: 5

reference:
- title: Daily series
  desc: Build and inspect the daily training-load calendar.
  contents:
  - as_daily_load
  - print.daily_load
  - summary.daily_load
- title: Load descriptors
  desc: Session RPE load, rolling load, monotony and strain.
  contents:
  - srpe_load
  - rolling_load
  - monotony_strain
- title: Impulse-response models
  desc: >
    Simulation of the Banister model (two-component and fitness-only), the
    response to a single session and to constant daily training.
  contents:
  - simulate_banister
  - print.banister_sim
  - session_response
  - constant_training
  - half_life

# Articles: one article per method (DECISIONS.md, D-006).
articles:
- title: Articles
  desc: Theory, computation and limitations of each method.
  contents:
  - articles/monotony-strain
  - articles/banister-model
